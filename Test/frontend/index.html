<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Machine Éloxage</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI";
    background: #12121a;
    color: white;
}

.header {
    background: #1f1f2e;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    padding: 15px;
}

.card {
    background: #1e1e2f;
    padding: 15px;
    border-radius: 12px;
}

.status {
    font-size: 20px;
    font-weight: bold;
}

.running { color: #2ecc71; }
.stopped { color: #e74c3c; }
.error { color: #f1c40f; }

button {
    padding: 12px 25px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

.start { background: #27ae60; }
.stop { background: #c0392b; }
.reset { background: #f39c12; }
.home { background: #2980b9; }

.controls {
    grid-column: span 2;
    text-align: center;
}
</style>
</head>

<body>

<div class="header">🧪 MACHINE ÉLOXAGE</div>

<div class="container">

    <!-- STATE -->
    <div class="card">
        <h2>État</h2>
        <div id="state" class="status">---</div>
        <p>Bac : <span id="index">-</span></p>
        <p>Running : <span id="running">-</span></p>
    </div>

    <!-- POSITION -->
    <div class="card">
        <h2>Position XYZ</h2>
        <p>X : <span id="x">0</span></p>
        <p>Y : <span id="y">0</span></p>
        <p>Z : <span id="z">0</span></p>
    </div>

    <!-- CONTROLS -->
    <div class="controls card">
        <button class="start" onclick="start()">START</button>
        <button class="stop" onclick="stop()">STOP</button>
        <button class="reset" onclick="reset()">RESET</button>
        <button class="home" onclick="home()">HOME</button>
    </div>

</div>

<script>

// ---------------- API SAFE CALL ----------------
async function api(url) {

    try {

        const res = await fetch(url, {
            method: "POST"
        });

        return await res.json();

    } catch (err) {

        console.error(err);
        alert("Erreur communication machine");

    }
}

// ---------------- BUTTONS ----------------
function start() { api("/start"); }
function stop()  { api("/stop"); }
function reset() { api("/reset"); }
function home()  { api("/home"); }

// ---------------- STATUS UPDATE ----------------
async function update() {

    try {

        const res = await fetch("/status");
        const d = await res.json();

        document.getElementById("state").innerText = d.state;
        document.getElementById("index").innerText = d.index;
        document.getElementById("running").innerText = d.running;

        document.getElementById("x").innerText = d.x;
        document.getElementById("y").innerText = d.y;
        document.getElementById("z").innerText = d.z;

        // couleur état
        let el = document.getElementById("state");

        el.className = "status";

        if (d.running) el.classList.add("running");
        else el.classList.add("stopped");

    } catch (e) {
        console.error("Status error", e);
    }
}

// ---------------- SLOWER LOOP (IMPORTANT) ----------------
setInterval(update, 300);

update();

</script>

</body>
</html>
